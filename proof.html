<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drop Proof · Raven's Watch Bingo</title>
<style>
  body{background:#0b1120;color:#e8ecf6;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:14px;max-width:900px;margin:0 auto}
  h1{font-size:20px;margin:4px 0 2px}
  .sub{color:#93a3c4;font-size:13px;margin-bottom:12px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;position:sticky;top:0;background:#0b1120;padding:8px 0;z-index:50}
  .bar button{background:#16223d;color:#cdd8f2;border:1px solid #2c3d5f;border-radius:20px;padding:7px 14px;font-size:14px;cursor:pointer}
  .bar button.on{background:#2c4a7c;color:#fff;border-color:#4a74b8}
  .bar input{background:#101a2e;color:#e8ecf6;border:1px solid #2c3d5f;border-radius:20px;padding:7px 14px;font-size:14px;flex:1;min-width:140px}
  h2.team{font-size:18px;margin:20px 0 6px}
  .tile{background:#131c33;border:1px solid #243354;border-radius:10px;padding:12px 14px;margin-bottom:12px}
  .tile h3{font-size:15px;margin:0 0 2px;color:#dbe5fa}
  .status{font-size:12.5px;color:#93a3c4;margin-bottom:10px}
  .status .done{color:#7dd87d;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .card{background:#0f1730;border:1px solid #22335c;border-radius:8px;overflow:hidden}
  .card img{width:100%;height:110px;object-fit:cover;display:block;cursor:pointer;background:#0a0f22}
  .card .noshot{height:110px;display:flex;align-items:center;justify-content:center;color:#5f7099;font-size:12.5px;background:#0a0f22;text-align:center;padding:0 8px}
  .card .meta{padding:7px 9px;font-size:12.5px;line-height:1.45}
  .card .who{font-weight:700;font-size:13px}
  .card .when{color:#93a3c4;font-size:11.5px}
  .tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:20px;margin-left:5px;vertical-align:middle}
  .tag.sheet{background:#274a27;color:#a5e3a5}
  .tag.shot{background:#4a3a10;color:#ffd97a}
  .tag.prog{background:#233a5e;color:#a9c6ff}
  .counts{font-size:13px;color:#cdd8f2;margin-bottom:4px}
  .copybtn{background:#16223d;color:#cdd8f2;border:1px solid #2c3d5f;border-radius:14px;padding:3px 10px;font-size:11.5px;cursor:pointer;margin-top:5px}
  .copybtn:active{background:#2c4a7c;color:#fff}
  #shotBox{position:fixed;inset:0;background:rgba(4,8,16,.93);z-index:4000;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:zoom-out;gap:12px}
  #shotBox[hidden]{display:none}
  #shotBox img{max-width:94vw;max-height:80vh;border-radius:10px}
  #shotBtns{display:flex;gap:10px}
  #shotBtns button{background:#2c4a7c;color:#fff;border:1px solid #4a74b8;border-radius:20px;padding:9px 18px;font-size:14.5px;cursor:pointer}
</style>
</head>
<body>
<h1>📸 Drop Proof — Raven's Watch Fall Bingo</h1>
<div class="sub">Every logged drop with its screenshot, by team and tile. Updates with the tracker every 15 minutes. Search by player, item, or tile — tap a picture to enlarge it, or hit Copy picture to grab it.</div>
<div class="bar" id="bar"></div>
<div id="app">Loading…</div>
<script>
var TEAMS=[{name:"Buying GF",color:"#987cf0"},{name:"Unpossible",color:"#4cbb80"},{name:"2B for Unpossible GFs",color:"#f28cb1"}];
var TILES=[["3m Slayer XP",7],["5m Sailing XP",7],["6m Crafting XP",7],["4m Fishing XP",7],["4m Runecrafting XP",7],["10m Firemaking XP",7],["5m Hunter XP",7],["Full Barrows Set",5],["5 Abyssal Whips",3],["Tome of Fire / Phoenix / Dragon Axe",3],["Any Zalcano Unique",5],["Golden Tench",3],["3 Tempoross Uniques",3],["Dragon Cannon Barrel",3],["3 Beef Pets",3],["5 Mad Angel Uniques",3],["3 Zenyte Shards",3],["5 Hunter Rumour Uniques",3],["4 Sailing Salvaging Uniques",3],["3 Bottled Storms",4],["4 Jeweller's Chisels",3],["3 TD Uniques",4],["Full Moons Set",3],["3 Dragon Pickaxes",4],["3 First-Time Raiders",5],["1,000 Pest Control Pts",3],["750 Abyssal Pearls",3],["50,000 Mastering Mixology Pts",3],["Any Nightmare Unique",4],["Any Doom Unique",4],["4 Hueycoatl Uniques",3],["3 Gryphon Uniques",4],["Twinflame Staff",3],["5 Venator Shards",4],["3 Kraken Uniques",3],["Enhanced Weapon Seed or 3 Armour Seeds",4],["3 Zulrah Uniques",4],["Any Revenant Weapon",5],["2 Yama Uniques",4],["Any Maggot King Unique",4],["Any Piece of Virtus",4],["3 God Wars Dungeon Uniques",4],["2 ToB Purples",5],["3 Araxxor Uniques",4],["20 TFA KC",5],["4 ToA Purples",5],["3 CoX Purples",5],["Any Colosseum Unique",4],["Any Nex Unique or 400 Nihil Shards",5]];
var GOALS={7:4,8:5,12:3,14:3,15:5,16:3,17:5,18:4,19:3,20:4,21:3,22:3,23:3,25:1000,26:750,27:50000,30:4,31:3,32:1,33:5,34:3,35:3,36:3,38:2,41:3,42:2,43:3,45:4,46:3,48:400};
var NAME2IDX={"Buying GF":0,"Unpossible":1,"2B for Unpossible GFs":2};
var DATA=null, curTeam=-1, curQ="";
function norm(s){return String(s||"").toLowerCase().replace(/[^a-z0-9 ]/g,"").trim();}
function wordsMatch(a,b){var wa=norm(a).split(" ").filter(Boolean),wb=norm(b).split(" ").filter(Boolean);if(!wa.length||!wb.length)return false;return wa.every(function(w){return wb.indexOf(w)>=0;})||wb.every(function(w){return wa.indexOf(w)>=0;});}
function itemMatch(a,b){var ia=norm(String(a||"").replace(/\(.*?\)/g,"")),ib=norm(String(b||"").replace(/\(.*?\)/g,""));return ia===ib||ia.endsWith(ib)||ib.endsWith(ia)||wordsMatch(ia,ib);}
function fmtT(t){return t?new Date(t).toLocaleString("en-US",{timeZone:"America/New_York",weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})+" ET":"time not recorded";}
var shotBoxEl=null, shotSrc="";
function openShot(e,src){if(e)e.stopPropagation();shotSrc=src;if(!shotBoxEl){shotBoxEl=document.createElement("div");shotBoxEl.id="shotBox";shotBoxEl.hidden=true;shotBoxEl.innerHTML="<img alt='Drop screenshot'><div id='shotBtns'><button id='shotCopy'>⧉ Copy picture</button><button id='shotOpen'>Open full size</button></div>";shotBoxEl.addEventListener("click",function(){shotBoxEl.hidden=true;});shotBoxEl.querySelector("#shotCopy").addEventListener("click",function(ev){ev.stopPropagation();copyImg(this,shotSrc);});shotBoxEl.querySelector("#shotOpen").addEventListener("click",function(ev){ev.stopPropagation();window.open(shotSrc,"_blank");});document.body.appendChild(shotBoxEl);}shotBoxEl.querySelector("img").src=src;shotBoxEl.hidden=false;}
function copyImg(btn,src){
  function done(ok){var old=btn.textContent;btn.textContent=ok?"Copied ✓":"Long-press the picture instead";setTimeout(function(){btn.textContent=old;},1700);}
  if(!navigator.clipboard||!window.ClipboardItem){done(false);return;}
  fetch(src).then(function(r){return r.blob();}).then(function(blob){
    function write(b){navigator.clipboard.write([new ClipboardItem({"image/png":b})]).then(function(){done(true);},function(){done(false);});}
    if(blob.type==="image/png"){write(blob);return;}
    var img=new Image();
    img.onload=function(){var c=document.createElement("canvas");c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext("2d").drawImage(img,0,0);c.toBlob(function(b){write(b||blob);},"image/png");URL.revokeObjectURL(img.src);};
    img.onerror=function(){write(blob);};
    img.src=URL.createObjectURL(blob);
  }).catch(function(){done(false);});
}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function buildEntries(d){
  var entries={}, used={};
  function add(tm,tile,e){var k=tm+":"+tile;(entries[k]=entries[k]||[]).push(e);}
  (d.DROPS.claims||[]).forEach(function(c){
    var tm=typeof c.team==="number"?c.team:NAME2IDX[c.team];
    var img=c.img||null;
    (d.SHOTS||[]).forEach(function(s,i){
      if(used[i]||img)return;
      if(s.team===tm&&s.tile===c.tile&&wordsMatch(s.p,c.player)&&itemMatch(s.item,c.item)){used[i]=1;img=s.img||null;}
    });
    add(tm,c.tile,{player:c.player,item:c.item,t:c.t,img:img,src:"sheet",n:c.count||1});
  });
  (d.SHOTS||[]).forEach(function(s,i){
    if(used[i]||s.team==null||s.tile==null)return;
    add(s.team,s.tile,{player:s.p,item:s.item,t:s.t,img:s.img||null,src:s.kind==="drop"?"shot":"prog",n:s.n||1});
  });
  return entries;
}
function render(){
  var d=DATA, entries=buildEntries(d);
  var marks=d.SHEET.marks, prog=d.DROPS.prog||{};
  var html="";
  TEAMS.forEach(function(tm,ti){
    if(curTeam>=0&&curTeam!==ti)return;
    var tiles={};
    Object.keys(entries).forEach(function(k){var p=k.split(":");if(+p[0]===ti)tiles[p[1]]=1;});
    marks[ti].forEach(function(t){tiles[t]=1;});
    var tileList=Object.keys(tiles).map(Number).sort(function(a,b){return a-b;});
    var teamDrops=0, teamPics=0;
    var body="";
    tileList.forEach(function(tile){
      var es=(entries[ti+":"+tile]||[]).slice().sort(function(a,b){return (a.t||0)-(b.t||0);});
      if(curQ){var tileHit=norm(TILES[tile][0]).indexOf(curQ)>=0;if(!tileHit)es=es.filter(function(e){return norm(e.player+" "+e.item).indexOf(curQ)>=0;});if(!es.length)return;}
      teamDrops+=es.length; es.forEach(function(e){if(e.img)teamPics++;});
      var done=marks[ti].indexOf(tile)>=0, goal=GOALS[tile];
      var status=done?'<span class="done">✓ Complete</span>':(goal?("Progress: "+(((prog[tile]||{})[ti]||0)+es.filter(function(e){return e.src!=="sheet";}).reduce(function(a,e){return a+e.n;},0))+" of "+goal):"");
      body+='<div class="tile"><h3>Tile '+tile+' — '+esc(TILES[tile][0])+' ('+TILES[tile][1]+' pts)</h3><div class="status">'+status+'</div>';
      if(!es.length){body+='<div class="status">Marked complete on the board — no individual drop screenshots on file.</div>';}
      body+='<div class="grid">'+es.map(function(e){
        var tag=e.src==="sheet"?'<span class="tag sheet">sheet log</span>':(e.src==="shot"?'<span class="tag shot">screenshot</span>':'<span class="tag prog">progress</span>');
        return '<div class="card">'+(e.img?'<img loading="lazy" src="'+e.img+'" onclick="openShot(event,this.src)" alt="">':'<div class="noshot">No screenshot<br>on file</div>')+
          '<div class="meta"><div class="who">'+esc(e.player)+'</div>'+esc(e.item)+(e.n>1?" ×"+e.n:"")+tag+'<div class="when">'+fmtT(e.t)+'</div>'+(e.img?'<button class="copybtn" onclick="copyImg(this,\''+e.img+'\')">⧉ Copy picture</button>':"")+'</div></div>';
      }).join("")+'</div></div>';
    });
    if(body)html+='<h2 class="team" style="color:'+tm.color+'">'+esc(tm.name)+'</h2><div class="counts">'+teamPics+' of '+teamDrops+' drops have a screenshot</div>'+body;
  });
  document.getElementById("app").innerHTML=html||'<div class="sub">Nothing matches.</div>';
}
function buildBar(){
  var bar=document.getElementById("bar");
  var btns=['<button data-t="-1" class="'+(curTeam===-1?"on":"")+'">All teams</button>'].concat(TEAMS.map(function(tm,ti){return '<button data-t="'+ti+'" class="'+(curTeam===ti?"on":"")+'">'+esc(tm.name)+'</button>';}));
  bar.innerHTML=btns.join("")+'<input id="q" type="search" placeholder="🔍 Search player, item, or tile…" value="'+esc(curQ)+'">';
  bar.querySelectorAll("button").forEach(function(b){b.addEventListener("click",function(){curTeam=+b.getAttribute("data-t");buildBar();render();});});
  var q=bar.querySelector("#q");
  q.addEventListener("input",function(){curQ=norm(q.value);render();});
}
fetch("data.json",{cache:"no-store"}).then(function(r){return r.json();}).then(function(d){DATA=d;buildBar();render();}).catch(function(e){document.getElementById("app").textContent="Could not load data.json — "+e;});
</script>
</body>
</html>
